<!DOCTYPE html>
<html lang="zh-Hant" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<script>
  /* 手機版固定為裝置寬度並禁止放大：iOS Safari 10+ 會忽略 user-scalable=no，
     故另外攔截其專有的雙指手勢；touch-action 則由下方 CSS 停用雙擊縮放。 */
  (function () {
    function block(e) { e.preventDefault(); }
    ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (n) {
      document.addEventListener(n, block, { passive: false });
    });
  })();
</script>
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#080e19">
<title>Cleanhands HUB</title>
<meta name="description" content="澳門國際機場抵澳與離澳航班、氣象觀測與天氣警告、市政署食品預警、街道歷史，以及旅遊局旅遊快訊活動資訊、市政署餐飲場所名單與旅遊局五類牌照場所資訊。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f1c30'/%3E%3Ctext x='32' y='44' font-size='34' font-family='serif' fill='%234fd1bd' text-anchor='middle'%3EI%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --header-h: 62px;
    --bg: #080e19;
    --bg-glow: rgba(79, 209, 189, .13);
    --surface: #101a2b;
    --surface-2: #16223a;
    --surface-3: #1b2942;
    --border: #22304a;
    --border-soft: #1a2740;
    --text: #e9f0fb;
    --muted: #93a7c4;
    --faint: #6b819f;
    --accent: #4fd1bd;
    --accent-2: #f4bd6a;
    --food-accent: #f08080;
    --shadow: 0 24px 60px rgba(2, 8, 18, .55);
    --radius: 18px;
  }
  html[data-theme="light"] {
    --bg: #eef3fa;
    --bg-glow: rgba(15, 140, 114, .10);
    --surface: #ffffff;
    --surface-2: #f4f8fd;
    --surface-3: #e9f0f9;
    --border: #dbe5f1;
    --border-soft: #e6eef8;
    --text: #101d33;
    --muted: #52678a;
    --faint: #7c90ad;
    --accent: #0f8c72;
    --accent-2: #a56809;
    --food-accent: #b8443c;
    --shadow: 0 20px 48px rgba(21, 43, 74, .10);
  }

  *, *::before, *::after { box-sizing: border-box; }
  [hidden] { display: none !important; }

  /* 版面寬度鎖定為裝置寬度；停用自動字級調整、雙指與雙擊放大 */
  html {
    width: 100%; max-width: 100%;
    -webkit-text-size-adjust: 100%; text-size-adjust: 100%;
    touch-action: pan-x pan-y;
  }

  body {
    margin: 0;
    width: 100%; max-width: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft JhengHei",
                 "Noto Sans TC", "PingFang TC", "Hiragino Sans GB", sans-serif;
    font-size: 17px;
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    transition: background-color .25s ease, color .25s ease;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background:
      radial-gradient(900px 480px at 50% -12%, var(--bg-glow), transparent 70%),
      radial-gradient(700px 400px at 92% 8%, rgba(244, 189, 106, .07), transparent 72%);
  }

  .shell {
    width: 100%;
    max-width: 1440px;
    margin: 0 auto;
    padding-inline: clamp(16px, 4vw, 32px);
    position: relative;
    z-index: 1;
  }

  a { color: inherit; }

  .skip {
    position: absolute;
    left: -9999px;
    top: 0;
    background: var(--accent);
    color: #04121a;
    padding: 10px 16px;
    border-radius: 0 0 10px 0;
    font-weight: 700;
    text-decoration: none;
    z-index: 100;
  }
  .skip:focus { left: 0; }

  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
    border-radius: 6px;
  }

  /* ---------------- 頁首 ---------------- */
  .site-header {
    position: sticky;
    top: 0;
    z-index: 30;
    background: color-mix(in srgb, var(--bg) 82%, transparent);
    backdrop-filter: saturate(180%) blur(14px);
    -webkit-backdrop-filter: saturate(180%) blur(14px);
    border-bottom: 1px solid var(--border-soft);
  }
  .header-inner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    min-height: 62px;
    padding-block: 9px;
  }
  .brand { display: flex; align-items: center; gap: 11px; min-width: 0; }
  .brand-text { display: flex; flex-direction: column; line-height: 1.25; min-width: 0; }
  .brand-text strong { font-size: 17.5px; letter-spacing: .04em; white-space: nowrap; }

  .header-right { display: flex; align-items: center; gap: 12px; }
  .macau-clock {
    display: flex; align-items: baseline; gap: 7px;
    font-variant-numeric: tabular-nums;
    font-size: 17px; font-weight: 700; letter-spacing: .05em;
    color: var(--text);
  }
  .macau-clock small { font-size: 12px; font-weight: 500; color: var(--faint); letter-spacing: .06em; }

  .icon-btn {
    width: 36px; height: 36px;
    display: grid; place-items: center;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--muted);
    cursor: pointer;
    transition: color .18s, border-color .18s, transform .18s;
  }
  .icon-btn:hover { color: var(--accent); border-color: var(--accent); }
  .icon-btn:active { transform: translateY(1px); }
  .icon-btn svg { width: 17px; height: 17px; }
  html[data-theme="dark"] .icon-sun { display: block; }
  html[data-theme="dark"] .icon-moon { display: none; }
  html[data-theme="light"] .icon-sun { display: none; }
  html[data-theme="light"] .icon-moon { display: block; }

  /* ---------------- 分類切換按鈕（捲動時固定在頁首下方） ---------------- */
  .view-tabs {
    position: sticky;
    top: var(--header-h);
    z-index: 25;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 9px;
    margin-top: clamp(14px, 2vw, 20px);
    margin-bottom: clamp(16px, 2vw, 22px);
    padding-block: 10px;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(14px) saturate(150%);
    -webkit-backdrop-filter: blur(14px) saturate(150%);
    border-bottom: 1px solid var(--border-soft);
    border-radius: 0 0 14px 14px;
  }
  .view-tab {
    flex: none;
    display: inline-flex; align-items: center; gap: 7px;
    padding: 8px 15px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: color-mix(in srgb, var(--surface) 78%, transparent);
    color: var(--muted);
    font: inherit;
    font-size: 14.5px; font-weight: 600;
    letter-spacing: .01em;
    white-space: nowrap;
    cursor: pointer;
    transition: color .18s, border-color .18s, background-color .18s, transform .18s;
  }
  .view-tab:hover { color: var(--text); border-color: color-mix(in srgb, var(--accent) 45%, var(--border)); }
  .view-tab:active { transform: translateY(1px); }
  .view-tab.is-active {
    color: var(--accent);
    border-color: color-mix(in srgb, var(--accent) 48%, var(--border));
    background: color-mix(in srgb, var(--accent) 14%, var(--surface));
    box-shadow: inset 0 1px 0 color-mix(in srgb, var(--accent) 14%, transparent);
  }
  html[data-theme="light"] .view-tab.is-active {
    color: #0a6b56;
    border-color: rgba(15, 118, 92, .42);
    background: rgba(15, 140, 114, .10);
  }
  .view-tab .tab-ico { width: 18px; height: 18px; border-radius: 4px; object-fit: contain; flex: none; }
  .view-tab .tab-ico + .tab-ico { margin-left: -4px; }
  /* 牌照場所的兩枚標誌（旅遊局 MGTO、市政署 IAM）一律以原圖顏色顯示，不隨主題反相 */

  /* 全站唯一的重新整理按鈕（頁首「澳門時間」右方，僅顯示圖示） */
  .refresh-btn {
    flex: none;
    width: 36px; height: 36px;
    display: grid; place-items: center;
    padding: 0;
    border-radius: 10px;
    border: 1px solid color-mix(in srgb, var(--accent) 38%, var(--border));
    background: color-mix(in srgb, var(--accent) 12%, var(--surface));
    color: var(--accent);
    cursor: pointer;
    box-shadow: inset 0 1px 0 color-mix(in srgb, var(--accent) 14%, transparent);
    transition: border-color .18s, background-color .18s, transform .18s, opacity .18s;
  }
  .refresh-btn:hover { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 20%, var(--surface)); }
  .refresh-btn:active { transform: translateY(1px); }
  .refresh-btn:disabled { opacity: .62; cursor: default; transform: none; }
  .refresh-btn svg { width: 17px; height: 17px; flex: none; }
  .refresh-btn.is-busy svg { animation: wb-spin .9s linear infinite; }
  .refresh-btn [data-refresh-label] { display: none; }
  @keyframes wb-spin { to { transform: rotate(360deg); } }
  /* 淺色底提高文字對比，維持至少 WCAG AA */
  html[data-theme="light"] .refresh-btn {
    color: #0a6b56;
    border-color: rgba(15, 118, 92, .42);
    background: rgba(15, 140, 114, .10);
  }
  html[data-theme="light"] .refresh-btn:hover {
    border-color: #0f8c72;
    background: rgba(15, 140, 114, .18);
  }

  /* ---------------- 天氣預報 1/2 + 合併天氣資訊 1/2 ---------------- */
  .top-row {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    gap: clamp(14px, 1.8vw, 20px);
    align-items: start;
    margin-bottom: clamp(18px, 2.4vw, 26px);
  }
  .top-row > * { min-width: 0; }
  @media (max-width: 900px) {
    .top-row { grid-template-columns: minmax(0, 1fr); }
  }
  .street-panel, .tour-panel, .dining-panel, .license-panel, .registry-panel { margin-bottom: clamp(18px, 2.4vw, 26px); }

  /* ---------------- 墨綠玻璃框 ---------------- */
  .flight-glass {
    position: relative;
    isolation: isolate;
    padding: clamp(14px, 1.9vw, 22px);
    border-radius: 26px;
    border: 1px solid rgba(96, 210, 170, .30);
    background:
      radial-gradient(620px 300px at 10% -16%, rgba(74, 205, 158, .22), transparent 72%),
      radial-gradient(520px 300px at 96% 108%, rgba(24, 132, 108, .20), transparent 70%),
      linear-gradient(135deg, rgba(11, 64, 52, .60), rgba(6, 40, 36, .42) 52%, rgba(13, 68, 56, .56));
    box-shadow:
      0 26px 64px rgba(2, 20, 16, .46),
      inset 0 1px 0 rgba(190, 255, 228, .16),
      inset 0 0 70px rgba(24, 124, 98, .12);
    backdrop-filter: blur(20px) saturate(155%);
    -webkit-backdrop-filter: blur(20px) saturate(155%);
  }
  .flight-glass::before {
    content: "";
    position: absolute;
    top: 0; left: 7%; right: 7%; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(176, 255, 222, .62), transparent);
    pointer-events: none;
  }
  .flight-glass::after {
    content: "";
    position: absolute;
    right: 0; bottom: 0;
    width: 78%; height: 100%;
    border-radius: inherit;
    background: radial-gradient(circle at 100% 100%, rgba(46, 178, 136, .20), transparent 68%);
    pointer-events: none;
    z-index: -1;
  }
  .flight-glass > .boards { position: relative; z-index: 1; }
  .flight-glass .acc {
    background: color-mix(in srgb, var(--surface) 88%, transparent);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border-color: rgba(120, 205, 176, .22);
  }
  .flight-glass .acc.is-open {
    border-color: color-mix(in srgb, var(--accent) 45%, var(--border));
  }
  html[data-theme="light"] .flight-glass {
    border-color: rgba(15, 118, 92, .26);
    background:
      radial-gradient(620px 300px at 10% -16%, rgba(70, 190, 150, .20), transparent 72%),
      radial-gradient(520px 300px at 96% 108%, rgba(28, 142, 112, .13), transparent 70%),
      linear-gradient(135deg, rgba(214, 242, 231, .80), rgba(238, 250, 244, .62) 52%, rgba(208, 238, 227, .76));
    box-shadow:
      0 22px 52px rgba(12, 70, 56, .14),
      inset 0 1px 0 rgba(255, 255, 255, .82),
      inset 0 0 70px rgba(30, 140, 108, .07);
  }
  html[data-theme="light"] .flight-glass::before {
    background: linear-gradient(90deg, transparent, rgba(18, 128, 96, .30), transparent);
  }
  html[data-theme="light"] .flight-glass::after {
    background: radial-gradient(circle, rgba(40, 165, 125, .13), transparent 68%);
  }
  html[data-theme="light"] .flight-glass .acc {
    background: color-mix(in srgb, var(--surface) 91%, transparent);
    border-color: rgba(15, 118, 92, .18);
  }

  /* ---------------- 食品預警玻璃框（置於航班看板下方） ---------------- */
  .food-glass {
    position: relative;
    isolation: isolate;
    margin-top: clamp(18px, 2.4vw, 26px);
    padding: clamp(14px, 1.9vw, 22px);
    border-radius: 26px;
    border: 1px solid rgba(240, 128, 128, .32);
    background:
      radial-gradient(620px 300px at 10% -16%, rgba(220, 72, 72, .22), transparent 72%),
      radial-gradient(520px 300px at 96% 108%, rgba(150, 32, 40, .20), transparent 70%),
      linear-gradient(135deg, rgba(78, 24, 30, .54), rgba(46, 16, 20, .42) 52%, rgba(78, 24, 30, .52));
    box-shadow:
      0 26px 64px rgba(28, 4, 8, .44),
      inset 0 1px 0 rgba(255, 200, 200, .16),
      inset 0 0 70px rgba(220, 72, 72, .10);
    backdrop-filter: blur(20px) saturate(155%);
    -webkit-backdrop-filter: blur(20px) saturate(155%);
  }
  .food-glass::before {
    content: "";
    position: absolute;
    top: 0; left: 7%; right: 7%; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255, 176, 176, .55), transparent);
    pointer-events: none;
  }
  .food-glass > .acc { position: relative; z-index: 1; }
  .food-glass .acc {
    background: color-mix(in srgb, var(--surface) 88%, transparent);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border-color: rgba(240, 128, 128, .24);
  }
  .food-glass .acc.is-open { border-color: color-mix(in srgb, var(--food-accent) 48%, var(--border)); }
  .acc-ico.food {
    background: color-mix(in srgb, var(--food-accent) 15%, transparent);
    color: var(--food-accent);
    border-color: color-mix(in srgb, var(--food-accent) 28%, transparent);
  }
  html[data-theme="light"] .food-glass {
    border-color: rgba(184, 68, 60, .26);
    background:
      radial-gradient(620px 300px at 10% -16%, rgba(232, 120, 112, .22), transparent 72%),
      radial-gradient(520px 300px at 96% 108%, rgba(200, 90, 80, .14), transparent 70%),
      linear-gradient(135deg, rgba(255, 242, 240, .84), rgba(253, 248, 247, .66) 52%, rgba(252, 236, 233, .80));
    box-shadow:
      0 22px 52px rgba(92, 24, 24, .14),
      inset 0 1px 0 rgba(255, 255, 255, .82),
      inset 0 0 70px rgba(184, 68, 60, .07);
  }
  html[data-theme="light"] .food-glass .acc {
    background: color-mix(in srgb, var(--surface) 91%, transparent);
    border-color: rgba(184, 68, 60, .20);
  }

  /* ---------------- 雙欄看板 ---------------- */
  .boards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(min(100%, 460px), 1fr));
    gap: clamp(14px, 2vw, 20px);
    align-items: start;
  }
  .acc-ico.dep svg { transform: rotate(90deg); }

  /* ---------------- 開闔卡片 ---------------- */
  .acc {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
    transition: border-color .2s;
  }
  .acc.is-open { border-color: color-mix(in srgb, var(--accent) 34%, var(--border)); }

  .acc-head { margin: 0; font-size: inherit; font-weight: inherit; }
  .acc-btn {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    padding: 16px 18px;
    background: transparent;
    border: 0;
    color: inherit;
    font: inherit;
    text-align: left;
    cursor: pointer;
    transition: background-color .18s;
  }
  .acc-btn:hover { background: color-mix(in srgb, var(--surface-2) 62%, transparent); }

  .acc-ico {
    flex: none;
    width: 34px; height: 34px;
    display: grid; place-items: center;
    border-radius: 10px;
    background: color-mix(in srgb, var(--accent) 13%, transparent);
    color: var(--accent);
    border: 1px solid color-mix(in srgb, var(--accent) 24%, transparent);
  }
  .acc-ico svg { width: 17px; height: 17px; }

  .acc-titles { display: flex; flex-direction: column; min-width: 0; flex: 1 1 auto; }
  .acc-title {
    font-size: clamp(17.5px, 2.1vw, 20px);
    font-weight: 700;
    letter-spacing: .01em;
    line-height: 1.35;
  }
  .acc-sub { font-size: 13.5px; color: var(--muted); margin-top: 2px; }

  .acc-state {
    flex: none;
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 10px;
    border-radius: 999px;
    border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent);
    background: color-mix(in srgb, var(--accent) 10%, transparent);
    color: var(--accent);
    font-size: 12px; font-weight: 700; letter-spacing: .12em;
  }
  .acc-state i {
    width: 6px; height: 6px; border-radius: 50%;
    background: currentColor;
    animation: blink 2.2s ease-in-out infinite;
  }
  @keyframes blink { 0%, 100% { opacity: 1 } 50% { opacity: .3 } }

  .acc-chev {
    flex: none;
    width: 30px; height: 30px;
    display: grid; place-items: center;
    color: var(--faint);
    transition: transform .34s cubic-bezier(.4, 0, .2, 1), color .18s;
  }
  .acc-chev svg { width: 15px; height: 15px; }
  .acc.is-open .acc-chev { transform: rotate(180deg); color: var(--accent); }

  .acc-panel {
    display: grid;
    grid-template-rows: 0fr;
    transition: grid-template-rows .4s cubic-bezier(.4, 0, .2, 1);
  }
  .acc.is-open .acc-panel { grid-template-rows: 1fr; }
  .acc-panel-in {
    overflow: hidden;
    min-height: 0;
  }
  .acc-body {
    padding: 4px clamp(14px, 2.4vw, 20px) 20px;
    border-top: 1px solid var(--border-soft);
    margin-top: 2px;
    padding-top: 20px;
  }

  .acc-note {
    display: flex;
    gap: 9px;
    align-items: flex-start;
    margin: 14px 2px 0;
    font-size: 13.5px;
    line-height: 1.6;
    color: var(--faint);
  }
  .acc-note svg { flex: none; width: 14px; height: 14px; margin-top: 2px; }

  /* ---------------- 頁尾 ---------------- */
  .site-footer {
    margin-top: clamp(36px, 6vw, 60px);
    padding: 22px 0 34px;
    border-top: 1px solid var(--border-soft);
    font-size: 13.5px;
    color: var(--faint);
  }
  .footer-inner {
    display: flex;
    justify-content: space-between;
    gap: 14px;
    flex-wrap: wrap;
    align-items: center;
  }
  .footer-inner p { margin: 0; max-width: 66ch; line-height: 1.7; }
  .footer-tag {
    display: inline-flex; align-items: center; gap: 8px;
    margin-left: auto;
    color: var(--muted);
    font-size: 13.5px; font-weight: 600; letter-spacing: .06em;
    white-space: nowrap;
  }
  .footer-tag .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 20%, transparent);
  }
  .site-footer a { color: var(--muted); text-decoration: none; border-bottom: 1px dotted currentColor; }
  .site-footer a:hover { color: var(--accent); }

  @media (max-width: 560px) {
    :root { --header-h: 56px; }
    .header-inner { min-height: 56px; gap: 8px; }
    .header-right { gap: 8px; }
    .brand-text small { display: none; }
    .macau-clock small { display: none; }
    .macau-clock { font-size: 15.5px; }
    .refresh-btn { width: 32px; height: 32px; }
    .refresh-btn svg { width: 15px; height: 15px; }
    .view-tabs {
      padding-block: 8px;
      gap: 7px;
      justify-content: flex-start;
      flex-wrap: nowrap;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scroll-snap-type: x proximity;
      scroll-padding-inline: clamp(16px, 4vw, 32px);
      scrollbar-width: none;
    }
    .view-tabs::-webkit-scrollbar { display: none; }
    .view-tab { padding: 7px 12px; font-size: 13.5px; scroll-snap-align: start; }
    .footer-tag { font-size: 12px; }
    .acc-btn { padding: 14px 13px; gap: 10px; align-items: flex-start; }
    .acc-ico { width: 30px; height: 30px; border-radius: 9px; margin-top: 1px; }
    .acc-ico svg { width: 15px; height: 15px; }
    .acc-state { display: none; }
    .acc-chev { margin-top: 3px; }
    .acc-body { padding: 16px 12px 16px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
  }

  @media print {
    body::before, .site-header, .refresh-btn { display: none; }

  }
</style>

<script>
/**
 * macau-arrivals-widget.js
 * 澳門國際機場「抵澳航班」網站小組件（可嵌入任何網站）
 *
 * 資料來源：澳門特別行政區政府數據開放平台 / 民航局
 *   https://data.gov.mo/Detail?id=c99cf420-23a1-4868-8ec1-7fe914e9fd8c
 * API：FIDS_Arrival_CN（GET，每 5 分鐘更新，完全開放）
 *
 * 用法（二擇一）：
 *   A. 外部檔：以 script 標籤的 src 指向本檔，再加上 macau-arrivals-widget 標籤
 *   B. 單檔內嵌：把本檔整段程式碼直接放進網頁的 script 區塊（亦可直接用
 *      macau-arrivals-inline.html，該頁已內嵌全部程式，只需上傳一個 HTML）
 *   本檔刻意不含會提前結束 script 區塊的字串，故可直接貼進 HTML 使用。
 *
 * 可用屬性：endpoint / appcode / proxy / limit / refresh / theme / title / compact / hide-footer
 * 公開方法：element.refresh()
 * 自訂事件：macau-arrivals:update、macau-arrivals:error
 */
(function () {
  'use strict';

  if (window.customElements && window.customElements.get('macau-arrivals-widget')) return;

  var DEFAULT_ENDPOINT = 'https://aacm.apigateway.data.gov.mo/api/open/listArrivalFlight/CHINESE';
  var DEFAULT_APPCODE = '09d43a591fba407fb862412970667de4';
  var DATASET_URL = 'https://data.gov.mo/Detail?id=c99cf420-23a1-4868-8ec1-7fe914e9fd8c';
  var MACAU_TZ = 'Asia/Macau';

  // 常見航空公司 IATA 二字碼對照（僅作顯示輔助；無對應時直接顯示二字碼）
  var AIRLINES = {
    'NX': '澳門航空', 'JX': '星宇航空', 'BR': '長榮航空', 'CI': '中華航空',
    'MU': '中國東方航空', 'FM': '上海航空', 'CZ': '中國南方航空', 'CA': '中國國際航空',
    'MF': '廈門航空', 'ZH': '深圳航空', '9C': '春秋航空', 'HU': '海南航空',
    'KE': '大韓航空', '7C': '濟州航空', 'BX': '釜山航空', 'OZ': '韓亞航空',
    'JL': '日本航空', 'NH': '全日空', 'AK': '亞洲航空', 'D7': '亞洲航空長程',
    'TR': '酷航', 'VJ': '越捷航空', 'VN': '越南航空', 'QH': '越捷航空',
    'K6': '柬埔寨吳哥航空', 'KR': '柬埔寨航空', 'PR': '菲律賓航空', '5J': '宿霧太平洋航空',
    'FD': '泰國亞洲航空', 'SL': '泰國獅航', 'TG': '泰國國際航空', 'IT': '台灣虎航'
  };

  function pad(n) { return String(n).padStart(2, '0'); }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function clamp(n, min, max, fallback) {
    n = parseInt(n, 10);
    return isFinite(n) ? Math.min(max, Math.max(min, n)) : fallback;
  }

  function macauHM(ts) {
    try {
      return new Intl.DateTimeFormat('zh-Hant', {
        timeZone: MACAU_TZ, hour: '2-digit', minute: '2-digit', hour12: false
      }).format(new Date(ts));
    } catch (e) { return '--:--'; }
  }

  /**
   * 解析航班時間。官方欄位：
   *   time = "06-11 09:35"  → dd-MM HH:mm（部分版本可能為 MM-dd）
   *   date = "06-11-2026"   → dd-MM-yyyy
   * 统一轉為帶 +08:00 的 timestamp，讓元件在任何時區的訪客皆顯示澳門時間。
   */
  function flightTimestamp(row) {
    var m = String(row && row.time || '').match(/^(\d{1,2})-(\d{1,2})\s+(\d{1,2}):(\d{2})/);
    if (!m) return null;
    var first = +m[1], second = +m[2], hh = +m[3], mm = +m[4];
    var year = new Date().getFullYear();
    var d = String(row && row.date || '').match(/(\d{1,2})-(\d{1,2})-(\d{4})/);
    var dd = first, MM = second;
    if (d) {
      year = +d[3];
      var dD = +d[1], mD = +d[2];
      // 若 time 為 MM-dd 而 date 為 dd-MM-yyyy，则對調
      if (second === dD && first === mD && !(first === dD && second === mD)) {
        dd = second; MM = first;
      } else {
        dd = first; MM = second;
      }
    }
    var ts = Date.parse(year + '-' + pad(MM) + '-' + pad(dd) + 'T' + pad(hh) + ':' + pad(mm) + ':00+08:00');
    return isFinite(ts) ? ts : null;
  }

  /** 以 row.date 的年月日搭配 HH:mm 組成澳門時間 timestamp（用於實際著陸／預計到達時間） */
  function sameDayTimestamp(row, hm) {
    if (!hm) return null;
    var d = String(row && row.date || '').match(/(\d{1,2})-(\d{1,2})-(\d{4})/);
    var now = new Date(Date.now() + 8 * 3600 * 1000); // 以 UTC 位移取得澳門的「今日」
    var dd = d ? +d[1] : now.getUTCDate();
    var MM = d ? +d[2] : now.getUTCMonth() + 1;
    var yy = d ? +d[3] : now.getUTCFullYear();
    var h = hm.match(/(\d{1,2}):(\d{2})/);
    if (!h) return null;
    var ts = Date.parse(yy + '-' + pad(MM) + '-' + pad(dd) + 'T' + pad(+h[1]) + ':' + h[2] + ':00+08:00');
    if (!isFinite(ts)) return null;
    // 跨午夜修正：23:50 起飛、00:20 著陸這類情況，狀態時間應視為次日
    var sched = flightTimestamp(row);
    if (isFinite(sched)) {
      if (ts - sched < -6 * 3600 * 1000) ts += 24 * 3600 * 1000;
      else if (ts - sched > 18 * 3600 * 1000) ts -= 24 * 3600 * 1000;
    }
    return ts;
  }

  /** 官方 status 值：航班著陸 HH:mm / 已啟航 預計到達 HH:mm / 航班延誤 / 航班取消 / "0"（未更新） */
  function classify(row) {
    var s = String(row && row.status == null ? '' : row.status).trim();
    var cancelled = /取消|cancel/i.test(s);
    var landed = !cancelled && /著陸|降落|抵達|已到達|landed|arrived/i.test(s);
    var delayed = /延誤|delay/i.test(s);
    var hm = (s.match(/(\d{1,2}:\d{2})/) || [])[1] || null;
    var eta = /預計到達/.test(s) ? hm : null;
    var actual = landed ? hm : null;
    var label;
    if (cancelled) label = '已取消';
    else if (landed) label = '已著陸';
    else if (eta) label = '已啟航';
    else if (delayed) label = '航班延誤';
    else if (s === '0' || s === '' || s === '0.0') label = '依表定';
    else label = s.length > 18 ? s.slice(0, 18) + '…' : s;
    var tone = cancelled ? 'muted' : landed ? 'landed' : eta ? 'enroute' : delayed ? 'warn' : 'scheduled';
    return { cancelled: cancelled, landed: landed, actual: actual, eta: eta, label: label, tone: tone, raw: s };
  }

  /** 相容三種回應：直接陣列、{data:[...]}、{data:"[...]"}（雙重編碼） */
  function normalize(payload) {
    var v = payload;
    for (var i = 0; i < 4; i++) {
      if (Array.isArray(v)) return v.filter(function (r) { return r && (r.time || r.date); });
      if (v && typeof v === 'object') {
        if (Array.isArray(v.data)) return v.data.filter(function (r) { return r && (r.time || r.date); });
        v = v.data != null ? v.data : (v.Data != null ? v.Data : v.result);
        continue;
      }
      if (typeof v === 'string') {
        try { v = JSON.parse(v); continue; } catch (e) { return []; }
      }
      return [];
    }
    return [];
  }

  function relativeText(ts, now, landed) {
    if (!isFinite(ts)) return '';
    var mins = Math.round((ts - now) / 60000);
    var abs = Math.abs(mins);
    var text = abs < 60 ? abs + ' 分鐘' : (Math.round(abs / 6) / 10) + ' 小時';
    if (abs < 1) return landed ? '剛剛' : '即將';
    if (landed) return mins <= 0 ? text + '前' : text + '後';
    return mins >= 0 ? text + '後' : '已過 ' + text;
  }

  var STYLE = `
    :host {
      --maw-bg: #101a2b;
      --maw-surface: #17243a;
      --maw-surface-2: #1d2c46;
      --maw-border: #2b3c58;
      --maw-text: #eef4ff;
      --maw-muted: #93a7c4;
      --maw-faint: #6f86a6;
      --maw-landed: #55d6b5;
      --maw-upcoming: #f4bd6a;
      --maw-warn: #f08b7b;
      --maw-radius: 16px;
      display: block;
      color: var(--maw-text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft JhengHei", "Noto Sans TC", "PingFang TC", sans-serif;
      font-size: 16px;
      line-height: 1.5;
      contain: layout style;
    }
    :host([data-theme="light"]) {
      --maw-bg: #f5f8fd;
      --maw-surface: #ffffff;
      --maw-surface-2: #f0f4fa;
      --maw-border: #dce5f1;
      --maw-text: #16233a;
      --maw-muted: #53688a;
      --maw-faint: #7c90ad;
      --maw-landed: #0f8c72;
      --maw-upcoming: #a56809;
      --maw-warn: #b8443c;
    }
    @media (prefers-color-scheme: light) {
      :host([data-theme="auto"]) {
        --maw-bg: #f5f8fd; --maw-surface: #ffffff; --maw-surface-2: #f0f4fa;
        --maw-border: #dce5f1; --maw-text: #16233a; --maw-muted: #53688a;
        --maw-faint: #7c90ad; --maw-landed: #0f8c72; --maw-upcoming: #a56809; --maw-warn: #b8443c;
      }
    }
    *, *::before, *::after { box-sizing: border-box; }
    .wrap {
      background: var(--maw-bg); border: 1px solid var(--maw-border);
      border-radius: var(--maw-radius); padding: 16px 15px 12px;
      box-shadow: 0 12px 32px rgba(0,0,0,.16);
      container-type: inline-size;
    }
    .hd { display: flex; justify-content: space-between; align-items: flex-start; gap: 14px; flex-wrap: wrap; }

  class MacauArrivalsWidget extends HTMLElement {
    static get observedAttributes() {
      return ['limit', 'refresh', 'theme', 'title', 'compact', 'hide-footer', 'proxy', 'endpoint', 'appcode'];
    }

    constructor() {
      super();

      this._cfg = {};
      this._data = null;
      this._updatedAt = null;
      this._loading = false;
      this._timer = null;
      this._abort = null;
      this._notice = '';
    }

    get cfg() {
      var a = function (n) { return this.getAttribute(n); }.bind(this);
      return {
        endpoint: a('endpoint') || DEFAULT_ENDPOINT,
        appcode: a('appcode') || DEFAULT_APPCODE,
        proxy: a('proxy') || '',
        limit: clamp(a('limit'), 1, 10, 5),
        refresh: clamp(a('refresh'), 15, 3600, 60),
        theme: a('theme') || 'dark',
        title: a('title') || '澳門國際機場 · 抵澳航班',
        compact: this.hasAttribute('compact'),
        hideFooter: this.hasAttribute('hide-footer')
      };
    }

    connectedCallback() {
      this._cfg = this.cfg;
      this.setAttribute('data-theme', this._cfg.theme);
      this._shell();
      this._startTimers();
      this.refresh();
    }

    disconnectedCallback() {
      clearInterval(this._timer);
      if (this._abort) this._abort.abort();
    }

    attributeChangedCallback(name, oldVal, newVal) {
      if (oldVal === newVal || !this.isConnected) return;
      var prev = this._cfg || {};
      this._cfg = this.cfg;
      this.setAttribute('data-theme', this._cfg.theme);
      if (name === 'refresh') this._startTimers();
      if (name === 'endpoint' || name === 'appcode' || name === 'proxy' || name === 'limit' || name === 'title' || name === 'theme' || name === 'compact' || name === 'hide-footer') {
        this._shell();
        if (name === 'endpoint' || name === 'appcode' || name === 'proxy') this.refresh();
        else if (this._data) this._paint();
      }
    }

    _startTimers() {
      clearInterval(this._timer);
      var self = this;
      this._timer = setInterval(function () {
        if (!document.hidden) self.refresh();
      }, this._cfg.refresh * 1000);
    }

    _shell() {
      this.shadowRoot.innerHTML = '<style>' + STYLE + '</style>' +
        '<div class="wrap" role="region" aria-label="' + esc(this._cfg.title) + '">' +
        '  <div class="hd">' +
        '    <div><h1>' + esc(this._cfg.title) + '</h1></div>' +
        '    <div class="hd-right">' +
        '      <div class="update-line"><span class="live"><i></i>LIVE</span><span data-updated>載入中</span></div></div>' +
        '  </div>' +
        '  <div data-notice></div>' +
        '  <div class="cols">' +
        '    <section class="panel landed"><div class="panel-head"><h2><i class="pip"></i>已降落</h2><span class="tag">最近 ' + this._cfg.limit + ' 班</span></div><ol data-landed></ol></section>' +
        '    <section class="panel upcoming"><div class="panel-head"><h2><i class="pip"></i>即將降落</h2><span class="tag">接下來 ' + this._cfg.limit + ' 班</span></div><ol data-upcoming></ol></section>' +
        '  </div>' +
        (this._cfg.hideFooter ? '' :
          '  <footer><span>資料來源：民航局／澳門政府數據開放平台（FIDS_Arrival_CN）</span>' +
          '<a href="' + DATASET_URL + '" target="_blank" rel="noopener noreferrer">查看資料集 ↗</a></footer>') +

    _skeleton() {
      var html = '';
      for (var i = 0; i < this._cfg.limit; i++) html += '<li class="skeleton"></li>';
      this.shadowRoot.querySelector('[data-landed]').innerHTML = html;
      this.shadowRoot.querySelector('[data-upcoming]').innerHTML = html;
    }

    /** 公開方法：立即重新抓取 */
    refresh() {
      if (this._loading) return;
      var self = this;
      var cfg = this._cfg = this.cfg;
      this._loading = true;
      this._abort = typeof AbortController !== 'undefined' ? new AbortController() : null;
      var opts = { method: 'GET', cache: 'no-store' };
      if (this._abort) opts.signal = this._abort.signal;
      if (!cfg.proxy) opts.headers = { Authorization: 'APPCODE ' + cfg.appcode };
      var url = cfg.proxy || cfg.endpoint;

      fetch(url, opts)
        .then(function (r) {

          return r.json();

        .then(function (payload) {
          var rows = normalize(payload);
          if (!rows.length) throw new Error('回應中沒有航班資料');
          self._data = rows;
          self._updatedAt = Date.now();
          self._notice = '';
          self._paint();
          self.dispatchEvent(new CustomEvent('macau-arrivals:update', {
            bubbles: true, composed: true,
            detail: { count: rows.length, updatedAt: self._updatedAt, source: cfg.proxy ? 'proxy' : 'direct' }
          }));
        })
        .catch(function (err) {
          if (err && err.name === 'AbortError') return;
          self._notice = self._data
            ? '暫時無法更新資料（' + esc(err.message) + '），以下為上次成功取得的資料。'
            : '無法取得航班資料（' + esc(err.message) + '），請稍後重試。';
          self._paintNotice();
          self.dispatchEvent(new CustomEvent('macau-arrivals:error', {
            bubbles: true, composed: true, detail: { message: err.message }
          }));
        })
        .then(function () {
          self._loading = false;
          var u = self.shadowRoot.querySelector('[data-updated]');
          if (u) u.textContent = self._updatedAt ? '更新於 ' + macauHM(self._updatedAt) : '尚未取得資料';
        });
    }

    _paintNotice() {
      var n = this.shadowRoot.querySelector('[data-notice]');
      if (!n) return;
      n.innerHTML = this._notice
        ? '<div class="notice' + (this._data ? ' stale' : '') + '" role="status">' + this._notice + '</div>'
        : '';
    }

    _paint() {
      if (!this._data) return;
      this._paintNotice();
      var now = Date.now();
      var cfg = this._cfg;
      var landed = [], upcoming = [];

      this._data.forEach(function (row) {
        var st = classify(row);
        var sched = flightTimestamp(row);
        var actual = st.landed && st.actual ? sameDayTimestamp(row, st.actual) : null;
        var eta = st.eta ? sameDayTimestamp(row, st.eta) : null;
        var effective = st.landed ? (actual || sched) : (eta || sched);
        if (!isFinite(effective)) return;
        var item = {
          row: row, st: st, sched: sched, effective: effective,
          airline: AIRLINES[String(row.airline || '').toUpperCase()] || String(row.airline || '')
        };
        if (st.cancelled) return;
        if (st.landed) landed.push(item);
        else upcoming.push(item);
      });

      landed.sort(function (a, b) { return b.effective - a.effective; });
      // 即將降落：只把仍在未來（容許 5 分鐘誤差）的航班排入前方；
      // 已過表定／預計時間但官方尚未更新狀態者，往後補位，避免佔據「接下來」的第一筆。
      var fresh = upcoming.filter(function (x) { return x.effective >= now - 5 * 60000; });
      var overdue = upcoming.filter(function (x) { return x.effective < now - 5 * 60000; });
      fresh.sort(function (a, b) { return a.effective - b.effective; });
      overdue.sort(function (a, b) { return b.effective - a.effective; });
      upcoming = fresh.concat(overdue);

      this.shadowRoot.querySelector('[data-landed]').innerHTML = this._rows(landed.slice(0, cfg.limit), true, now);
      this.shadowRoot.querySelector('[data-upcoming]').innerHTML = this._rows(upcoming.slice(0, cfg.limit), false, now);
      var u = this.shadowRoot.querySelector('[data-updated]');
      if (u && this._updatedAt) u.textContent = '更新於 ' + macauHM(this._updatedAt);
    }

    _rows(items, isLanded, now) {
      if (!items.length) return '<li class="empty">暫無符合條件的航班</li>';
      return items.map(function (x) {
        var r = x.row;
        var mainTime = isLanded
          ? (x.st.actual || macauHM(x.sched))
          : (x.st.eta || macauHM(x.sched));
        var caption = isLanded ? (x.st.actual ? '著陸' : '表定') : (x.st.eta ? '預計' : '表定');
        var rel = relativeText(x.effective, now, isLanded);
        return '<li class="row">' +
          '<div class="t"><b>' + esc(mainTime) + '</b><small>' + caption + '</small></div>' +
          '<div class="main">' +
            '<div class="origin" title="出發地：' + esc(r.origin || '') + '">' + esc(r.origin || '—') + '</div>' +
            '<div class="meta">' + esc(r.flightNo || '') + ' · ' + esc(x.airline) + '</div>' +
            '<div class="foot"><span class="badge ' + x.st.tone + '">' + esc(x.st.label) + '</span>' +
              (rel ? '<span class="rel">' + esc(rel) + '</span>' : '') + '</div>' +
          '</div>' +
        '</li>';
      }).join('');
    }
  }

  if (window.customElements) window.customElements.define('macau-arrivals-widget', MacauArrivalsWidget);
})();

<script>
/**
 * macau-departures-widget.js
 * 澳門國際機場「離澳航班」網站小組件
 *

 *
 * 資料來源：澳門特別行政區政府數據開放平台 / 民航局
 *   https://data.gov.mo/Detail?id=f910cf2e-5e30-45c3-9e62-3eb6bf912db3
 * API：listDepartureFlight/CHINESE（GET，每 5 分鐘更新，完全開放）

  var DATASET_URL = 'https://data.gov.mo/Detail?id=f910cf2e-5e30-45c3-9e62-3eb6bf912db3';
  var MACAU_TZ = 'Asia/Macau';

  // 常見航空公司 IATA 二字碼對照（僅作顯示輔助；無對應時直接顯示二字碼）
  var AIRLINES = {
    'NX': '澳門航空', 'JX': '星宇航空', 'BR': '長榮航空', 'CI': '中華航空',
    'MU': '中國東方航空', 'FM': '上海航空', 'CZ': '中國南方航空', 'CA': '中國國際航空',
    'MF': '廈門航空', 'ZH': '深圳航空', '9C': '春秋航空', 'HU': '海南航空',
    'KE': '大韓航空', '7C': '濟州航空', 'BX': '釜山航空', 'OZ': '韓亞航空',
    'JL': '日本航空', 'NH': '全日空', 'AK': '亞洲航空', 'D7': '亞洲航空長程',
    'TR': '酷航', 'VJ': '越捷航空', 'VN': '越南航空', 'QH': '越捷航空',
    'K6': '柬埔寨吳哥航空', 'KR': '柬埔寨航空', 'PR': '菲律賓航空', '5J': '宿霧太平洋航空',

  function pad(n) { return String(n).padStart(2, '0'); }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {

  /**
   * 解析航班時間。官方欄位：

    var m = String(row && row.time || '').match(/^(\d{1,2})-(\d{1,2})\s+(\d{1,2}):(\d{2})/);

    var sched = flightTimestamp(row);

  function classify(row) {
    var s = String(row && row.status == null ? '' : row.status).trim();
    var cancelled = /取消|cancel/i.test(s);
    var departed = !cancelled && /已啟航|航班起飛|離港|已出發|departed|airborne/i.test(s);
    var delayed = /延誤|delay/i.test(s);
    var closed = /停止登機|最後召集|final call/i.test(s);
    var boarding = /登機|boarding/i.test(s);
    var hm = (s.match(/(\d{1,2}:\d{2})/) || [])[1] || null;
    var actual = departed ? hm : null;                 // 實際起飛時間
    var eta = /延誤至|預計/.test(s) ? hm : null;        // 延誤後／預計起飛時間
    var label;
    if (cancelled) label = '已取消';
    else if (departed) label = '已起飛';
    else if (delayed) label = '航班延誤';
    else if (closed) label = '停止登機';
    else if (boarding) label = '登機中';

    else label = s.length > 18 ? s.slice(0, 18) + '…' : s;
    var tone = cancelled ? 'muted' : departed ? 'landed' : delayed ? 'warn'
      : (eta || closed || boarding) ? 'enroute' : 'scheduled';
    return { cancelled: cancelled, departed: departed, actual: actual, eta: eta, label: label, tone: tone, raw: s };
  }

  /** 相容三種回應：直接陣列、{data:[...]}、{data:"[...]"}（雙重編碼） */
  function normalize(payload) {
    var v = payload;
    for (var i = 0; i < 4; i++) {
      if (Array.isArray(v)) return v.filter(function (r) { return r && (r.time || r.date); });
      if (v && typeof v === 'object') {
        if (Array.isArray(v.data)) return v.data.filter(function (r) { return r && (r.time || r.date); });
        v = v.data != null ? v.data : (v.Data != null ? v.Data : v.result);
        continue;
      }
      if (typeof v === 'string') {
        try { v = JSON.parse(v); continue; } catch (e) { return []; }
      }
      return [];
    }
    return [];
  }

  function relativeText(ts, now, landed) {
    if (!isFinite(ts)) return '';
    var mins = Math.round((ts - now) / 60000);
    var abs = Math.abs(mins);
    var text = abs < 60 ? abs + ' 分鐘' : (Math.round(abs / 6) / 10) + ' 小時';
    if (abs < 1) return landed ? '剛剛' : '即將';
    if (landed) return mins <= 0 ? text + '前' : text + '後';
    return mins >= 0 ? text + '後' : '已過 ' + text;
  }

  var STYLE = `
    :host {

    :host([data-theme="light"]) {

    }

    .hd h1 { margin: 0; font-size: 19px; font-weight: 700; letter-spacing: .02em; }
    .hd .sub { margin: 4px 0 0; font-size: 13.5px; color: var(--maw-muted); }
    .hd-right { text-align: right; font-variant-numeric: tabular-nums; }
    .update-line { margin-top: 4px; font-size: 13px; color: var(--maw-muted); display: flex; gap: 7px; align-items: center; justify-content: flex-end; }
    .live { display: inline-flex; align-items: center; gap: 5px; color: var(--maw-landed); font-weight: 700; font-size: 12px; letter-spacing: .1em; }
    .live i { width: 7px; height: 7px; border-radius: 50%; background: var(--maw-landed); box-shadow: 0 0 0 3px color-mix(in srgb, var(--maw-landed) 22%, transparent); animation: pulse 2.2s infinite; }
    @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .35 } }
    .hd { margin-bottom: 12px; }
    /* 重新整理按鈕已移除，全站統一由頁首單一按鈕控制 */
    .cols { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    /* 僅在窄欄（手機／半寬看板）才上下堆疊，寬螢幕善用橫向空間左右並排 */
    @container (max-width: 500px) { .cols { grid-template-columns: 1fr; } }
    @media (max-width: 620px) { .cols { grid-template-columns: 1fr; } }
    @container (max-width: 480px) {
      .hd { flex-direction: column; gap: 7px; }
      .hd-right { text-align: left; display: flex; align-items: baseline; flex-wrap: wrap; gap: 9px; }
      .update-line { justify-content: flex-start; margin-top: 0; }
    }
    .panel { background: var(--maw-surface); border: 1px solid var(--maw-border); border-radius: 12px; padding: 11px 10px 10px; min-width: 0; }
    .panel-head { display: flex; align-items: baseline; justify-content: space-between; gap: 6px; margin-bottom: 9px; }
    .panel-head h2 { margin: 0; font-size: 15.5px; font-weight: 700; display: flex; align-items: center; gap: 7px; }

    .t b { display: block; font-size: 17.5px; font-weight: 700; letter-spacing: .01em; line-height: 1.15; }
    .t small { display: block; font-size: 11.5px; color: var(--maw-faint); margin-top: 2px; }
    .main { min-width: 0; }
    .origin { font-size: 16px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    a { color: var(--maw-muted); text-decoration: none; border-bottom: 1px dotted currentColor; }
    a:hover { color: var(--maw-landed); }
    :host([compact]) .wrap { padding: 13px; }
    :host([compact]) .row { padding: 7px 9px; }

  `;

  class MacauDeparturesWidget extends HTMLElement {
    static get observedAttributes() {
      return ['limit', 'refresh', 'theme', 'title', 'compact', 'hide-footer', 'proxy', 'endpoint', 'appcode'];
    }

    constructor() {
      super();
      this.attachShadow({ mode: 'open' });
      this._cfg = {};
      this._data = null;
      this._updatedAt = null;
      this._loading = false;
      this._timer = null;
      this._abort = null;
      this._notice = '';
    }

    get cfg() {
      var a = function (n) { return this.getAttribute(n); }.bind(this);
      return {
        endpoint: a('endpoint') || DEFAULT_ENDPOINT,
        appcode: a('appcode') || DEFAULT_APPCODE,
        proxy: a('proxy') || '',
        limit: clamp(a('limit'), 1, 10, 5),
        refresh: clamp(a('refresh'), 15, 3600, 60),
        theme: a('theme') || 'dark',
        title: a('title') || '澳門國際機場 · 離澳航班',
        compact: this.hasAttribute('compact'),
        hideFooter: this.hasAttribute('hide-footer')
      };
    }

    connectedCallback() {
      this._cfg = this.cfg;
      this.setAttribute('data-theme', this._cfg.theme);
      this._shell();
      this._startTimers();
      this.refresh();
    }

    disconnectedCallback() {
      clearInterval(this._timer);
      if (this._abort) this._abort.abort();
    }

    attributeChangedCallback(name, oldVal, newVal) {
      if (oldVal === newVal || !this.isConnected) return;
      var prev = this._cfg || {};
      this._cfg = this.cfg;
      this.setAttribute('data-theme', this._cfg.theme);
      if (name === 'refresh') this._startTimers();
      if (name === 'endpoint' || name === 'appcode' || name === 'proxy' || name === 'limit' || name === 'title' || name === 'theme' || name === 'compact' || name === 'hide-footer') {
        this._shell();
        if (name === 'endpoint' || name === 'appcode' || name === 'proxy') this.refresh();
        else if (this._data) this._paint();
      }
    }

    _startTimers() {
      clearInterval(this._timer);
      var self = this;
      this._timer = setInterval(function () {
        if (!document.hidden) self.refresh();
      }, this._cfg.refresh * 1000);
    }

    _shell() {
      this.shadowRoot.innerHTML = '<style>' + STYLE + '</style>' +
        '<div class="wrap" role="region" aria-label="' + esc(this._cfg.title) + '">' +
        '  <div class="hd">' +
        '    <div><h1>' + esc(this._cfg.title) + '</h1></div>' +
        '    <div class="hd-right">' +
        '      <div class="update-line"><span class="live"><i></i>LIVE</span><span data-updated>載入中</span></div></div>' +
        '  </div>' +
        '  <div data-notice></div>' +
        '  <div class="cols">' +
        '    <section class="panel upcoming"><div class="panel-head"><h2><i class="pip"></i>即將起飛</h2><span class="tag">接下來 ' + this._cfg.limit + ' 班</span></div><ol data-upcoming></ol></section>' +
        '    <section class="panel landed"><div class="panel-head"><h2><i class="pip"></i>已起飛</h2><span class="tag">最近 ' + this._cfg.limit + ' 班</span></div><ol data-landed></ol></section>' +
        '  </div>' +
        (this._cfg.hideFooter ? '' :
          '  <footer><span>資料來源：民航局／澳門政府數據開放平台（民航局離澳航班資料）</span>' +
          '<a href="' + DATASET_URL + '" target="_blank" rel="noopener noreferrer">查看資料集 ↗</a></footer>') +
        '</div>';
      if (!this._data) this._skeleton();
    }

    _skeleton() {
      var html = '';
      for (var i = 0; i < this._cfg.limit; i++) html += '<li class="skeleton"></li>';
      this.shadowRoot.querySelector('[data-landed]').innerHTML = html;
      this.shadowRoot.querySelector('[data-upcoming]').innerHTML = html;
    }

    /** 公開方法：立即重新抓取 */
    refresh() {
      if (this._loading) return;
      var self = this;
      var cfg = this._cfg = this.cfg;
      this._loading = true;
      this._abort = typeof AbortController !== 'undefined' ? new AbortController() : null;
      var opts = { method: 'GET', cache: 'no-store' };
      if (this._abort) opts.signal = this._abort.signal;
      if (!cfg.proxy) opts.headers = { Authorization: 'APPCODE ' + cfg.appcode };
      var url = cfg.proxy || cfg.endpoint;

      fetch(url, opts)
        .then(function (r) {
          if (!r.ok) throw new Error('HTTP ' + r.status);
          return r.json();
        })
        .then(function (payload) {
          var rows = normalize(payload);
          if (!rows.length) throw new Error('回應中沒有航班資料');
          self._data = rows;
          self._updatedAt = Date.now();
          self._notice = '';
          self._paint();
          self.dispatchEvent(new CustomEvent('macau-departures:update', {
            bubbles: true, composed: true,
            detail: { count: rows.length, updatedAt: self._updatedAt, source: cfg.proxy ? 'proxy' : 'direct' }
          }));
        })
        .catch(function (err) {
          if (err && err.name === 'AbortError') return;
          self._notice = self._data
            ? '暫時無法更新資料（' + esc(err.message) + '），以下為上次成功取得的資料。'
            : '無法取得航班資料（' + esc(err.message) + '），請稍後重試。';
          self._paintNotice();
          self.dispatchEvent(new CustomEvent('macau-departures:error', {
            bubbles: true, composed: true, detail: { message: err.message }
          }));
        })
        .then(function () {
          self._loading = false;
          var u = self.shadowRoot.querySelector('[data-updated]');
          if (u) u.textContent = self._updatedAt ? '更新於 ' + macauHM(self._updatedAt) : '尚未取得資料';
        });
    }

    _paintNotice() {
      var n = this.shadowRoot.querySelector('[data-notice]');
      if (!n) return;
      n.innerHTML = this._notice
        ? '<div class="notice' + (this._data ? ' stale' : '') + '" role="status">' + this._notice + '</div>'
        : '';
    }

    _paint() {
      if (!this._data) return;
      this._paintNotice();
      var now = Date.now();
      var cfg = this._cfg;
      var landed = [], upcoming = [];

      this._data.forEach(function (row) {
        var st = classify(row);
        var sched = flightTimestamp(row);
        var actual = st.departed && st.actual ? sameDayTimestamp(row, st.actual) : null;
        var eta = st.eta ? sameDayTimestamp(row, st.eta) : null;
        var effective = st.departed ? (actual || sched) : (eta || sched);
        if (!isFinite(effective)) return;
        var item = {
          row: row, st: st, sched: sched, effective: effective,
          airline: AIRLINES[String(row.airline || '').toUpperCase()] || String(row.airline || '')
        };
        if (st.cancelled) return;
        if (st.departed) landed.push(item);
        else upcoming.push(item);
      });

      landed.sort(function (a, b) { return b.effective - a.effective; });
      // 即將起飛：只把仍在未來（容許 5 分鐘誤差）的航班排入前方；
      // 已過表定／預計時間但官方尚未更新狀態者，往後補位，避免佔據「接下來」的第一筆。
      var fresh = upcoming.filter(function (x) { return x.effective >= now - 5 * 60000; });
      var overdue = upcoming.filter(function (x) { return x.effective < now - 5 * 60000; });
      fresh.sort(function (a, b) { return a.effective - b.effective; });
      overdue.sort(function (a, b) { return b.effective - a.effective; });
      upcoming = fresh.concat(overdue);

      this.shadowRoot.querySelector('[data-landed]').innerHTML = this._rows(landed.slice(0, cfg.limit), true, now);
      this.shadowRoot.querySelector('[data-upcoming]').innerHTML = this._rows(upcoming.slice(0, cfg.limit), false, now);
      var u = this.shadowRoot.querySelector('[data-updated]');
      if (u && this._updatedAt) u.textContent = '更新於 ' + macauHM(this._updatedAt);
    }

    _rows(items, isLanded, now) {
      if (!items.length) return '<li class="empty">暫無符合條件的航班</li>';
      return items.map(function (x) {
        var r = x.row;
        var mainTime = isLanded
          ? (x.st.actual || macauHM(x.sched))
          : (x.st.eta || macauHM(x.sched));
        var caption = isLanded ? (x.st.actual ? '起飛' : '表定') : (x.st.eta ? '預計' : '表定');
        var rel = relativeText(x.effective, now, isLanded);
        return '<li class="row">' +
          '<div class="t"><b>' + esc(mainTime) + '</b><small>' + caption + '</small></div>' +
          '<div class="main">' +
            '<div class="origin" title="目的地：' + esc(r.destination || '') + '">' + esc(r.destination || '—') + '</div>' +
            '<div class="meta">' + esc(r.flightNo || '') + ' · ' + esc(x.airline) + (r.gate ? ' · 閘口 ' + esc(r.gate) : '') + '</div>' +
            '<div class="foot"><span class="badge ' + x.st.tone + '">' + esc(x.st.label) + '</span>' +
              (rel ? '<span class="rel">' + esc(rel) + '</span>' : '') + '</div>' +
          '</div>' +
        '</li>';
      }).join('');
    }
  }

  if (window.customElements) window.customElements.define('macau-departures-widget', MacauDeparturesWidget);
})();

</script>
<script>
/**
 * macau-weather-widget.js
 * 澳門天氣預報網站小組件
 *
 * 資料來源（依優先序）：
 *   1. 澳門地球物理氣象局官方 XML
 *      （c_actual_brief.xml 全澳概況 / c_7daysforecast.xml 七日預報 /
 *       c_actualweather.xml 全澳自動氣象站逐站觀測）
 *      由政府數據開放平台「七日天氣預報」資料集目錄指向：
 *      https://api.data.gov.mo/document/download/4ad04fae-852d-4d31-b31c-77dfc080f8f5
 *      實測 www.smg.gov.mo/smg/xml/ 鏡像回應 Access-Control-Allow-Origin: *，
 *      瀏覽器可直連官方檔案（支援 file:// 的 null origin）；若直連失敗才退回
 *      r.jina.ai 文字代理讀取原站 xml.smg.gov.mo（該站本身未開放 CORS）。
 *      氣象站下拉的數值（氣溫、濕度、風向、風速、陣風、日高低溫、露點）
 *      取自所選測站；天氣概況文字與圖示則為全澳概述（測站 XML 不含天氣現象）。
 *   2. 目錄 API：取得資料集名稱、提供部門與官方網址，作為標題副標之依據。
 *      該端點實測約 50% 機率回「內部錯誤」，故為非阻塞請求並重試 3 次，
 *      失敗時改用內建文案，不影響天氣資料顯示。
 *   3. Open-Meteo（CORS 全開、免金鑰）：兩種用途。
 *      a) 官方 XML 不可用時的整體備援資料；
 *      b) 補充「每日降雨機率」——官方 c_7daysforecast.xml 僅提供氣溫與
 *         相對濕度區間，並無降雨機率欄位，故以 Open-Meteo 的
 *         daily.precipitation_probability_max 依日期對應補進七日格子，

 *
 * 可用屬性：refresh / theme / title / station
 *   station 可填測站代碼（如 EM）或中文名稱（如 黑沙環），預設 EM 黑沙環。

 * 自訂事件：macau-weather:update、macau-weather:error
 */
(function () {

  var SMG_STATIONS = 'c_actualweather.xml';
  var DEFAULT_STATION = 'EM'; // 黑沙環
  /* 官方「實時天氣」資料集列出的全部測站；即使某站當下缺值，下拉仍完整列出。 */
  var KNOWN_STATIONS = [
    ['DP', '紀念孫中山市政公園'], ['EM', '黑沙環'], ['FM', '大炮台'],
    ['PE', '外港'], ['MM', '媽閣'], ['TG', '大潭山'],

    @keyframes sh { 0%,100% { opacity: .55 } 50% { opacity: 1 } }
    /* 與右側預警卡並排（約 2/3 欄寬）時整體縮小，讓兩卡高度相稱 */

      .metric b { font-size: 13.5px; min-width: 0; text-align: right; }

  class MacauWeatherWidget extends HTMLElement {
    static get observedAttributes() { return ['refresh', 'theme', 'title', 'station']; }

    constructor() {
      super();
      this.attachShadow({ mode: 'open' });
      this._cfg = {};
      this._data = null;
      this._source = '';
      this._updatedAt = null;
      this._pub = '';
      this._loading = false;
      this._timer = null;
      this._notice = '';
      this._dirName = '七日天氣預報';
      this._dirDept = '地球物理氣象局';
      this._station = DEFAULT_STATION;
    }

    get cfg() {
      var a = function (n) { return this.getAttribute(n); }.bind(this);
      return {
        refresh: clamp(a('refresh'), 60, 3600, 600),
        theme: a('theme') || 'dark',
        title: a('title') || '澳門天氣預報'
      };
    }

    connectedCallback() {
      this._cfg = this.cfg;
      this._station = resolveStation(this.getAttribute('station'));
      this.setAttribute('data-theme', this._cfg.theme);
      this._shell();
      this._startTimer();
      this._loadDirectory();
      this.refresh();
    }

    disconnectedCallback() { clearInterval(this._timer); }

    attributeChangedCallback(name, oldVal, newVal) {
      if (oldVal === newVal || !this.isConnected) return;
      this._cfg = this.cfg;
      this.setAttribute('data-theme', this._cfg.theme);
      if (name === 'refresh') this._startTimer();
      if (name === 'station') {
        this._station = resolveStation(newVal);
        this._syncStationSelect();
        if (this._data) this._paint();
      }
      if (name === 'title') { this._shell(); if (this._data) this._paint(); }
    }

    _startTimer() {
      clearInterval(this._timer);
      var self = this;
      this._timer = setInterval(function () {
        if (!document.hidden) self.refresh();
      }, this._cfg.refresh * 1000);
    }

    _shell() {
      this.shadowRoot.innerHTML = '<style>' + STYLE + '</style>' +
        '<div class="card" role="region" aria-label="' + esc(this._cfg.title) + '">' +
        '  <div class="hd"><div><h2><i class="pip"></i>' + esc(this._cfg.title) + '</h2>' +
        '    <p class="sub" data-sub>' + esc(this._dirDept) + ' · ' + esc(this._dirName) + '</p></div>' +
        '    <div class="hd-right"><span class="stamp" data-stamp>載入中</span></div></div>' +
        '  <div data-notice></div>' +
        '  <div class="station-bar">' +
        '    <label class="station-label">觀測氣象站' +
        '      <span class="station-pick"><select data-station aria-label="選擇觀測氣象站"></select></span>' +
        '    </label>' +
        '    <span class="station-hint" data-station-hint>共 ' + KNOWN_STATIONS.length + ' 個測站</span>' +
        '  </div>' +
        '  <div class="now"><div class="main-tile" data-now></div><div class="metrics" data-metrics></div></div>' +
        '  <div class="chips" data-chips hidden></div>' +
        '  <div class="forecast"><div class="forecast-hd"><h3>未來七日' +
        '    <small class="pop-key" title="每日天氣圖示下方為降雨機率（數值模式預報）">' + DROP + '降雨機率</small></h3>' +
        '    <span data-pub></span>' +
        '    <span class="hint">← 左右滑動查看全部七日 →</span></div>' +
        '    <div class="days" data-days></div></div>' +
        '</div>';
      var self = this;
      this.shadowRoot.querySelector('[data-station]').addEventListener('change', function (e) {
        self._station = e.target.value;
        self._paint();
        self.dispatchEvent(new CustomEvent('macau-weather:station', {
          bubbles: true, composed: true, detail: { station: self._station }
        }));
      });
      this._syncStationSelect();
      if (!this._data) this._skeleton();
    }

    /** 建立／同步下拉選項，並保留使用者目前選取的測站 */
    _syncStationSelect() {
      var sel = this.shadowRoot.querySelector('[data-station]');
      if (!sel) return;
      var live = this._data && this._data.stations;
      var list = (live && live.length ? live : KNOWN_STATIONS.map(function (k) {
        return { code: k[0], name: k[1] };
      }));
      var html = list.map(function (s) {
        return '<option value="' + esc(s.code) + '">' + esc(s.name) + '</option>';
      }).join('');
      if (sel.innerHTML !== html) sel.innerHTML = html;
      var exists = list.some(function (s) { return s.code === this._station; }.bind(this));
      if (!exists) this._station = DEFAULT_STATION;
      sel.value = this._station;
      sel.disabled = !(live && live.length);
      var hint = this.shadowRoot.querySelector('[data-station-hint]');
      if (hint) {
        hint.textContent = live && live.length
          ? '共 ' + list.length + ' 個測站 · 每 5 分鐘更新'
          : '觀測資料載入中…';
      }
    }

    _skeleton() {
      var h = '';
      for (var i = 0; i < 7; i++) h += '<div class="skeleton"></div>';
      this.shadowRoot.querySelector('[data-days]').innerHTML = h;
      this.shadowRoot.querySelector('[data-now]').innerHTML =
        '<div style="font-size:18px;color:var(--ww-muted)">正在取得氣象資料…</div>';
    }

    /** 目錄 API：非阻塞、失敗重試 3 次，只用於標題副標 */
    _loadDirectory() {
      var self = this, tries = 0;
      function attempt() {
        fetch(DIRECTORY_API, { cache: 'no-store' })
          .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
          .then(function (j) {
            if (!j || j.code || !j.dataDir || !j.dataDir.length) throw new Error('bad payload');
            var d = j.dataDir[0];
            var name = d.name, dept = d.department;
            if (d.info) {
              Array.prototype.forEach.call(d.info, function (o) {
                if (o.nameTc) name = o.nameTc;
                if (o.departmentTc) dept = o.departmentTc;
              });
            }
            if (name) self._dirName = name;
            if (dept) self._dirDept = dept;
            var el = self.shadowRoot.querySelector('[data-sub]');
            if (el) el.textContent = self._dirDept + ' · ' + self._dirName;
          })
          .catch(function () {
            if (++tries < 3) setTimeout(attempt, 500);
          });
      }
      attempt();
    }

    refresh() {
      if (this._loading) return;
      var self = this;
      this._loading = true;

      function loadDoc(file) {
        return grab(SMG_BASE + file)
          .catch(function () { return grab(JINA + SMG_LEGACY + file); })
          .then(parseXml)
          .catch(function () { return null; });
      }

      /* 氣象局七日預報 XML 未提供降雨機率，另取 Open-Meteo 每日最大降雨機率；
         此為非阻塞補充，失敗時該列顯示「—」，不影響官方溫度／圖示／描述。 */
      var probJob = grab(OPEN_METEO)
        .then(function (t) { return JSON.parse(t); })
        .then(rainProbMap)
        .catch(function () { return null; });

      Promise.all([loadDoc(SMG_ACTUAL), loadDoc(SMG_FORECAST), loadDoc(SMG_STATIONS), probJob]).then(function (res) {
        var now = res[0] ? parseActual(res[0]) : null;
        var fc = res[1] ? parseForecast(res[1]) : null;
        var stations = res[2] ? parseStations(res[2]) : null;
        var prob = res[3];
        function withProb(v) {
          v.days = v.days.map(function (day) {
            if (prob && prob[day.date] != null) day.prob = prob[day.date];
            return day;
          });
          return v;
        }
        if (now && fc && fc.days.length) {
          return withProb({
            now: now, days: fc.days, pub: fc.pub, source: 'smg',
            stations: stations ? mergeStations(stations) : null
          });
        }
        return grab(OPEN_METEO)
          .then(function (t) { return JSON.parse(t); })
          .then(function (j) {
            var v = fromOpenMeteo(j);
            if (!v) throw new Error('備援資料格式異常');
            v.source = 'open-meteo';
            v.stations = null;
            return v;
          });
      }).then(function (data) {
        self._data = data;
        self._source = data.source;
        self._pub = data.pub || '';
        self._updatedAt = Date.now();
        self._notice = '';
        self._paint();
        self.dispatchEvent(new CustomEvent('macau-weather:update', {
          bubbles: true, composed: true,
          detail: { source: data.source, days: data.days.length, station: self._station, updatedAt: self._updatedAt }
        }));
      }).catch(function (err) {
        self._notice = self._data
          ? '暫時無法更新（' + esc(err.message) + '），以下為上次成功取得的資料。'
          : '無法取得天氣資料（' + esc(err.message) + '），請稍後重試。';
        self._paintNotice();
        self.dispatchEvent(new CustomEvent('macau-weather:error', {
          bubbles: true, composed: true, detail: { message: err.message }
        }));
      }).then(function () {
        self._loading = false;
        var s = self.shadowRoot.querySelector('[data-stamp]');
        if (s) s.textContent = self._updatedAt ? '更新於 ' + macauHM(self._updatedAt) : '尚未取得資料';
      });
    }

    _paintNotice() {
      var n = this.shadowRoot.querySelector('[data-notice]');
      if (n) n.innerHTML = this._notice ? '<div class="notice" role="status">' + this._notice + '</div>' : '';
    }

    _paint() {
      if (!this._data) return;
      this._paintNotice();
      this._syncStationSelect();

      var d = this._data, base = d.now;
      var st = null;
      if (d.stations && d.stations.length) {
        Array.prototype.some.call(d.stations, function (s) {
          if (s.code === this._station) { st = s; return true; }
          return false;
        }, this);
      }
      /* 有測站觀測時，數值以該站為準；天氣現象與圖示仍採全澳簡報 */
      var now = {
        temp: st ? (st.temp || '—') : base.temp,
        humidity: st ? st.humidity : base.humidity,
        wind: st ? st.wind : base.wind,
        windDir: st ? st.windDir : base.windDir,
        windLevel: st ? '' : base.windLevel,
        feels: st ? st.feels : base.feels,
        desc: base.desc,
        kind: base.kind || 'partly',
        valid: st ? st.time : base.valid
      };
      var kind = now.kind;
      var numeric = /^-?\d+(\.\d+)?$/.test(String(now.temp));
      var condLine = st
        ? '全澳概況 · ' + st.name + ' 觀測 ' + (now.valid ? now.valid.slice(-5) : '--:--') +
          (st.offline ? ' · 暫無觀測值' : (!st.temp && !st.humidity ? ' · 僅提供風力' : ''))
        : ([now.feels, now.valid ? '觀測 ' + now.valid.slice(-5) : ''].filter(Boolean).join(' · ') || '澳門即時天氣');
      this.shadowRoot.querySelector('[data-now]').innerHTML =
        '<div class="ico">' + iconSvg(kind, 62) + '</div>' +
        '<div><div class="temp">' + esc(now.temp) + (numeric ? '<sup>°C</sup>' : '') + '</div>' +
        '<div class="cond"><b>' + esc(now.desc) + '</b>' +
        '<span>' + esc(condLine) + '</span></div></div>';

      var metrics = [
        ['相對濕度', now.humidity ? now.humidity + '%' : '—'],
        ['風向', now.windDir || '—'],
        ['風速', now.wind ? now.wind + ' km/h' : '—'],
        ['風力／體感', now.windLevel || now.feels || '—']
      ];
      this.shadowRoot.querySelector('[data-metrics]').innerHTML = metrics.map(function (m) {
        return '<div class="metric"><small>' + esc(m[0]) + '</small><b>' + esc(m[1]) + '</b></div>';
      }).join('');

      var chips = this.shadowRoot.querySelector('[data-chips]');
      if (chips) {
        if (st) {
          chips.hidden = false;
          chips.innerHTML = [
            ['陣風', st.gust ? st.gust + ' km/h' : '—'],
            ['日高溫', st.hi ? st.hi + '°C' : '—'],
            ['日低溫', st.lo ? st.lo + '°C' : '—'],
            ['露點', st.dew ? st.dew + '°C' : '—']
          ].map(function (c) {
            return '<div class="chip"><small>' + esc(c[0]) + '</small><b>' + esc(c[1]) + '</b></div>';
          }).join('');
        } else {
          chips.hidden = true;
          chips.innerHTML = '';
        }
      }

      this.shadowRoot.querySelector('[data-days]').innerHTML = d.days.map(function (x) {
        var md = String(x.date).slice(5).replace('-', '/');
        var label = x.desc ? String(x.desc).split(/[。；，]/)[0] : '';
        var p = (x.prob == null || !isFinite(x.prob))
          ? null : Math.max(0, Math.min(100, Math.round(x.prob)));
        var popCls = 'pop' + (p == null ? ' is-na' : (p >= 60 ? ' is-high' : ''));
        var tip = x.desc || '';
        if (p != null) tip += (tip ? ' · ' : '') + '降雨機率 ' + p + '%';
        return '<div class="day" title="' + esc(tip) + '">' +
          '<div class="dw">週' + esc(x.dow) + '</div>' +
          '<div class="dt">' + esc(md) + '</div>' +
          '<div class="di">' + iconSvg(x.kind, 40) + '</div>' +
          '<div class="' + popCls + '" title="降雨機率（數值模式預報）">' + DROP +

          '<div class="tt"><b>' + esc(x.hi) + '°</b><i>/</i><em>' + esc(x.lo) + '°</em></div>' +
          '<div class="ds">' + esc(label) + '</div>' +
        '</div>';
      }).join('');

    var lines = [];
    Array.prototype.forEach.call(doc.getElementsByTagName('WeatherForecast'), function (n) {
      String(txt(n, 'WeatherDescription')).split(/[。；;\n]/).forEach(function (part) {
        part = clean(part);
        if (part && /雨|雷|驟|陣/.test(part) && lines.indexOf(part) < 0 && lines.length < 5) lines.push(part);
      });
    });
    return { situation: situation, days: days, lines: lines, pub: sysPub(doc) };

  function grab(url, ms) {
    var ctl = typeof AbortController !== 'undefined' ? new AbortController() : null;
    var timer = ctl ? setTimeout(function () { ctl.abort(); }, ms || 14000) : null;
    var opts = { cache: 'no-store' };
    if (ctl) opts.signal = ctl.signal;
    return fetch(url, opts).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.text();
    }).then(function (t) {
      if (timer) clearTimeout(timer);
      return t;
    }, function (e) {
      if (timer) clearTimeout(timer);
      throw e;
    });
  }
  /** 官方鏡像直連為主，文字代理與原站直連為備援 */
  function loadDoc(file) {
    return grab(SMG_BASE + file)
      .catch(function () { return grab(JINA + SMG_LEGACY + file); })
      .catch(function () { return grab(SMG_LEGACY + file, 8000); })
      .then(parseXml)
      .catch(function () { return null; });
  }

  /** 產生一列資訊；on=true 時亮燈 */
  function rowHtml(kind, label, big, sub, on, level) {
    return '<div class="row' + (on ? ' is-on lv' + (level || 1) : '') + '">' +
      '<div class="k">' + icon(kind, 15) + esc(label) + '</div>' +
      '<div class="v"><b title="' + esc(big) + '">' + esc(big) + '</b>' +
      (sub ? '<p title="' + esc(sub) + '">' + esc(sub) + '</p>' : '') + '</div>' +
      (on ? '<i class="led" aria-hidden="true"></i>' : '') + '</div>';
  }

  /** 概況日期標籤：2026-11-10 → 11月10日星期二 */
  function dayLabel(dateStr) {
    var m = String(dateStr || '').match(/^(\d{4})-(\d{2})-(\d{2})/);
    if (!m) return '';
    try {
      return new Intl.DateTimeFormat('zh-Hant', {
        timeZone: MACAU_TZ, month: 'long', day: 'numeric', weekday: 'long'
      }).format(new Date(Date.UTC(+m[1], +m[2] - 1, +m[3], 4)));
    } catch (e) { return m[0]; }
  }

  /** 今日／明日天氣概況：左右兩個分段按鈕（DSMG 手機版樣式），點擊切換內容 */
  function outlookHtml(fc, tab) {
    var days = (fc && fc.days) || [];
    var isTomorrow = tab === 'tomorrow';
    var day = days[isTomorrow ? 1 : 0] || null;
    var body;
    if (day) {
      var lead = (!isTomorrow && fc && fc.situation) ? fc.situation : '';
      body = (lead ? '<p class="seg-lead">' + esc(lead) + '</p>' : '') +
        '<ul class="seg-list">' + day.lines.map(function (l) {
          return '<li' + (/雨|雷/.test(l) ? ' class="is-rain"' : '') + '>' + esc(l) + '</li>';
        }).join('') + '</ul>';
    } else {
      body = '<p class="seg-lead is-empty">氣象局暫未提供' + (isTomorrow ? '明日' : '今日') +
        '天氣概況。</p>';
    }
    var sub = day ? dayLabel(day.date) : '';
    return '<div class="outlook" data-outlook>' +
      '<div class="seg" role="tablist" aria-label="天氣概況">' +
        '<button type="button" role="tab" class="seg-btn' + (isTomorrow ? '' : ' is-on') +
          '" data-otab="today" aria-selected="' + (isTomorrow ? 'false' : 'true') + '">今日</button>' +
        '<button type="button" role="tab" class="seg-btn' + (isTomorrow ? ' is-on' : '') +
          '" data-otab="tomorrow" aria-selected="' + (isTomorrow ? 'true' : 'false') + '">明日</button>' +
      '</div>' +
      '<div class="seg-body" role="tabpanel" aria-label="' + (isTomorrow ? '明日' : '今日') + '天氣概況">' +
        (sub ? '<div class="seg-date">' + esc(sub) + '</div>' : '') + body +
      '</div></div>';
  }

  /** 展開面板：單一生效信號的完整資訊，含官方「發佈內容」 */
  function detailHtml(x) {
    var meta = [];
    if (x.changedAt || x.issued) meta.push(['發出時間', x.changedAt || x.issued]);
    if (x.changedAt && x.issued && x.changedAt !== x.issued) meta.push(['更新時間', x.issued]);
    if (x.code && !/^(NIL|0|NULL|NONE)$/i.test(x.code)) meta.push(['信號代碼', x.code]);
    var rows = meta.map(function (p) {
      return '<dt>' + esc(p[0]) + '</dt><dd>' + esc(p[1]) + '</dd>';
    }).join('');
    return '<article class="d-item">' +
      '<div class="d-hd"><b>' + esc(x.name) + '</b>' +
      '<span class="lvl">' + esc(x.label || '生效中') + '</span></div>' +
      (rows ? '<dl class="d-meta">' + rows + '</dl>' : '') +
      '<div class="d-body"><h4>發佈內容</h4><p>' +
      esc(x.desc || '氣象局未提供此信號的詳細發佈內容。') + '</p></div>' +
      '</article>';
  }

              '<i class="glow" aria-hidden="true"></i>' + esc(cancelText(x)) + '</span>';
          }).join('');
          state.innerHTML = '<div class="emblem">' + emblem(0) + '</div>' +
            '<div class="words"><div class="state-hd"><b>0 天氣警告</b>' +
            '<span class="clear-sub">' + esc(clearSub) + '</span></div>' +
            cancelLines + '</div>';
        } else {
          state.className = 'state is-alert';
          var detail = short(active.map(function (x) {
            return x.name + ' ' + x.label;
          }).join(' · '), 46);
          state.innerHTML = '<div class="emblem">' + emblem(1) + '</div>' +
            '<div class="words"><b>' + active.length + ' 天氣警告</b><span>' + esc(detail) + '</span></div>';
        }
      }

      /* --- 2. 即時特別天氣訊息（無訊息時整區隱藏） --- */
      var sp = this.shadowRoot.querySelector('[data-special]');
      if (sp) {
        if (!specials.length) {
          sp.hidden = true;
          sp.innerHTML = '';
        } else {
          sp.hidden = false;
          sp.className = 'sec special' + (liveSpecial.length ? ' is-on' : '');
          var shown = specials.slice(0, 2);
          sp.innerHTML = '<div class="sec-hd">即時特別天氣訊息' +
            '<span class="count">' + (liveSpecial.length ? liveSpecial.length + ' 則生效中' : '近期訊息') +
            (specials.length > shown.length ? ' · 顯示前 ' + shown.length + ' 則' : '') + '</span></div>' +
            shown.map(function (x) {
              return '<div class="sp-item' + (x.inforce ? ' is-on' : '') + '">' +
                '<div class="sp-hd"><b>' + esc(x.title) + '</b>' +
                (x.time ? '<time>' + esc(x.time) + '</time>' : '') + '</div>' +
                '<p title="' + esc(x.desc) + '">' + esc(x.desc || '氣象局已發出特別天氣訊息。') + '</p></div>';
            }).join('');
        }
      }

      /* --- 3. 六類信號 6 × 1 --- */
      this.shadowRoot.querySelector('[data-list]').innerHTML = list.map(function (x) {
        var cls = 'sig' + (x.active ? ' is-on lv' + x.level : '') + (x.unknown ? ' is-unknown' : '');
        /* 未生效格只留名稱，不顯示「未生效」字樣；生效格才顯示等級／狀態 */
        var shown = x.unknown ? '狀態未知' : (x.active ? x.label : '');
        var tip = x.unknown ? '暫時無法取得此項狀態'
          : (x.active ? (x.desc || x.name + ' 生效中')
            : (x.cancelledAt ? cancelText(x) : x.name));
        if (x.issued && x.active) tip += '（' + x.issued + '）';
        return '<li class="' + cls + '" title="' + esc(tip) + '">' +
          '<span class="sig-ico">' + icon(x.ico, 20) + '</span>' +
          '<span class="sig-name">' + esc(x.name) + '</span>' +
          '<span class="sig-state">' + esc(shown) + '</span></li>';
      }).join('');

      /* --- 3b. 熱帶氣旋信號：僅在生效時出現，置於「各類警告信號」下方 --- */
      var cyBox = this.shadowRoot.querySelector('[data-cyclone]');
      if (cyBox) {
        var cy = null;
        for (var ci = 0; ci < list.length; ci++) {
          if (list[ci].key === 'typhoon' && list[ci].active) { cy = list[ci]; break; }
        }
        if (!cy) {
          cyBox.hidden = true;
          cyBox.innerHTML = '';
        } else {
          var c = cy.cyclone || {};
          var cname = clean(c.name);
          var cdesc = clean(c.major) || clean(cy.desc) || '熱帶氣旋正影響本澳，請留意最新天氣資訊。';
          var cextra = clean(c.tts) || clean(c.misc) || clean(c.minor);
          if (cextra === cdesc) cextra = '';
          cyBox.hidden = false;
          cyBox.innerHTML =
            '<div class="sec-hd">熱帶氣旋信號<span class="count">' + esc(cy.label || '生效中') + '</span></div>' +
            '<div class="cy">' +
              '<div class="cy-hd"><b>' + (cname ? '熱帶氣旋 ' + esc(cname) : '熱帶氣旋') + '</b>' +
                (cy.label ? '<span class="cy-badge">' + esc(cy.label) + '</span>' : '') + '</div>' +
              '<p class="cy-desc">' + esc(cdesc) + '</p>' +
              (cextra ? '<p class="cy-extra">' + esc(cextra) + '</p>' : '') +
              '<div class="cy-meta">' +
                (cy.changedAt ? '信號發出：' + esc(cy.changedAt) : (cy.issued ? '更新時間：' + esc(cy.issued) : '')) +
              '</div>' +
            '</div>';
        }
      }

      /* --- 4. 暴雨・水浸・雨勢（生效狀況僅在警告生效時顯示） --- */
      var hasWarn = !!(rain && rain.active);
      var floodReal = (rain ? rain.flood : []).filter(function (s) {
        return !/(沒有|並無|並未|無水浸|未見|解除|暫無|未有|不適用)/.test(s);
      });
      var hasFlood = hasWarn && floodReal.length > 0;

      var hd = this.shadowRoot.querySelector('[data-rain-hd]');
      if (hd) {
        hd.innerHTML = (hasWarn ? '暴雨警告・水浸・雨勢' : '天氣概況') +
          '<span class="count" data-rain-count>' + (hasWarn ? '生效中' : '參考') + '</span>';
      }

      var rows = [];
      if (hasWarn) {
        var signalSub = (rain.desc || '氣象局已發出暴雨警告信號。') +
          (rain.issued ? '（' + rain.issued + '）' : '');
        rows.push(rowHtml('signal', '生效信號', rain.label, short(signalSub, 76), true, rain.level));
        if (hasFlood) {
          rows.push(rowHtml('flood', '水浸情況', '請注意水浸', short(floodReal.slice(0, 2).join('；'), 76), true, rain.level));
        }
      }
      rows.push(outlookHtml(fc, this._otab));
      if (!rain) {
        rows.push(rowHtml('signal', '信號狀態', '暫時未能確認', '氣象局暴雨警告資料暫時無法取得。', false, 0));
      }
      this.shadowRoot.querySelector('[data-rows]').innerHTML = rows.join('');
      this._paintDetail();
    }
  }

  if (window.customElements) window.customElements.define('macau-warnings-widget', MacauWarningsWidget);
})();

</script>
